[project]
name = "onnx-study"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx[socks]>=0.28.1",
    "huggingface-hub>=1.24.0",
    "jiwer>=4.0.0",
    "netron>=9.1.8",
    "numpy>=2.5.1",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "onnxsim>=0.6.5",
    "psutil>=7.2.2",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "sympy>=1.14.0",
    "tabulate>=0.10.0",
    "tokenizers>=0.22.2",
]

[dependency-groups]
dev = [
    "datasets>=5.0.0",
    "onnxscript>=0.7.1",
    "sounddevice>=0.5.5",
    "soxr>=1.1.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.uv]
find-links = ["./wheels"]
